# =========================================================
#  Config de la Pioche Évolutive
# =========================================================
# Chaque palier définit :
#   mining: largeur / hauteur / profondeur de la zone minée d'un coup
#   speed: amplificateur de Hâte (Haste) appliqué au joueur qui tient la pioche (0 = aucun)
#   fortune: niveau d'enchantement Fortune appliqué à la pioche
#   efficiency: niveau d'enchantement Efficacité appliqué à la pioche
#   reach-bonus: blocs de portée supplémentaires (0 = vanilla)
#   sell-bonus: multiplicateur de vente (0.10 = +10%)
#   quest: la quête à accomplir pour DÉBLOQUER ce palier (null = automatique / niveau 1)
#       material: identifiant Bukkit du bloc à miner (ex: COAL_ORE), ou "ANY" pour "n'importe quel bloc"
#       amount: quantité à miner

levels:

  1:
    mining: { width: 1, height: 1, depth: 1 }
    speed: 0
    fortune: 1
    efficiency: 0
    reach-bonus: 0
    sell-bonus: 0.0
    quest: null

  10:
    mining: { width: 1, height: 1, depth: 1 }
    speed: 1
    fortune: 2
    efficiency: 1
    reach-bonus: 0
